<script type="module">
import * as THREE from 'three';
import {OrbitControls} from '/overview_prototype_assets/OrbitControls.js';
import {LineSegments2} from '/overview_prototype_assets/lines/LineSegments2.js';
import {LineSegmentsGeometry} from '/overview_prototype_assets/lines/LineSegmentsGeometry.js';
import {LineMaterial} from '/overview_prototype_assets/lines/LineMaterial.js';

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const color = name => { let h = 2166136261; for (const ch of name) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return new THREE.Color().setHSL((h >>> 0) / 2**32, 0.75, 0.6); };
const IN = new THREE.Color('#4ad8ff'), OUT = new THREE.Color('#ffb14a'), WHITE = new THREE.Color('#ffffff'), GRPC = new THREE.Color('#ff4fe8');
let CALL_OPACITY = 0.07; const GRPC_OPACITY = 0.85, DIM = 0.1;

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 1, 1e6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.zoomToCursor = true; // wheel zooms toward the point under the cursor
// Left drag always orbits, right drag always pans. OrbitControls swaps the two when
// ctrl/meta/shift is held, and macOS ctrl-click arrives as a right click with ctrlKey,
// so pre-swap the mapping before its own pointerdown handler runs.
renderer.domElement.addEventListener('pointerdown', e => {
  const mod = e.ctrlKey || e.metaKey || e.shiftKey;
  controls.mouseButtons.LEFT = mod ? THREE.MOUSE.PAN : THREE.MOUSE.ROTATE;
  controls.mouseButtons.RIGHT = mod ? THREE.MOUSE.ROTATE : THREE.MOUSE.PAN;
}, {capture: true});

// Everything below is rebuilt by load(): hiding a project re-lays-out the whole
// overview on the server, so positions, edges and indices all change.
let D = null, N = 0, P = 0, pcol = [], R = 1;
let stars = null, calls = null, grpc = null, hl = null;
let out = [], inn = [];
let labels = [];
let focus = null; // {node: i} or {edge: {s, t, via}}
// added: projects the user synced into the overview; hidden: added but unchecked.
const added = new Set(JSON.parse(localStorage.getItem('dw.added') || '[]'));
const hidden = new Set(JSON.parse(localStorage.getItem('dw.hidden') || '[]'));
const shownProjects = () => [...added].filter(p => !hidden.has(p));
const showQS = () => shownProjects().map(p => 'show=' + encodeURIComponent(p)).join('&');
let detected = [], workspace = '';
const syncing = new Set(), syncErr = new Map(), syncNote = new Map(); // note: short-lived "up to date" / "synced"
const m4 = new THREE.Matrix4(), v = new THREE.Vector3(), q4 = new THREE.Quaternion(), s3 = new THREE.Vector3();
const where = i => `${D.projects[D.proj[i]]}:${D.files[D.file[i]]}:${D.line[i]}`;
const swatch = i => `<span class="sw" style="background:#${pcol[D.proj[i]].getHexString()}"></span>`;

// Star skin: a camera-facing quad per instance with a white-hot core and a soft halo
// in the project colour. Additive, so dimmed stars (colour scaled down) fade out.
// The core keeps the old sphere's radius (the instance scale); the halo reaches HALO times further.
const HALO = 2.2;
const starMaterial = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    varying vec2 vUv; varying vec3 vColor;
    void main() {
      vUv = position.xy;
      vColor = vec3(1.0);
      #ifdef USE_INSTANCING_COLOR
        vColor = instanceColor;
      #endif
      vec4 c = modelViewMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
      c.xy += position.xy * length(instanceMatrix[0].xyz) * ${HALO.toFixed(1)};
      gl_Position = projectionMatrix * c;
    }`,
  fragmentShader: `
    varying vec2 vUv; varying vec3 vColor;
    void main() {
      float d = length(vUv);
      if (d > 1.0) discard;
      float r = 1.0 / ${HALO.toFixed(1)};
      float x = d / r;                      // 0 at the centre, 1 at the old sphere's edge
      float body = exp(-x * x * 2.5);       // bright centre fading smoothly to the edge
      float hot = pow(body, 6.0);           // white only at the very centre
      float halo = pow(1.0 - d, 3.0) * 0.2;
      vec3 c = vColor * (body * 1.2 + halo) + vec3(hot * 0.7) * max(max(vColor.r, vColor.g), vColor.b);
      gl_FragColor = vec4(c, 1.0);
    }`,
});
function segments(pairs, colorOf, opacity) {
  const pos = new Float32Array(pairs.length * 3), col = new Float32Array(pairs.length * 3);
  for (let k = 0; k < pairs.length; k++) {
    const i = pairs[k];
    pos.set([D.pos[3*i], D.pos[3*i+1], D.pos[3*i+2]], 3*k);
    const c = colorOf(k); col.set([c.r, c.g, c.b], 3*k);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return new THREE.LineSegments(g, new THREE.LineBasicMaterial({vertexColors: true, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false}));
}
function drop(o) { if (o) { scene.remove(o); o.geometry.dispose(); o.material.dispose(); } return null; }

let loadSeq = 0, dataBytes = 0;
// What this page allocated itself: every vertex, index and instance buffer in the
// scene (uploaded to the GPU, and kept in JS too) plus the layout JSON it parsed.
// The browser's own overhead (JS engine, DOM, textures, canvas) is not counted.
function pageBytes() {
  const seen = new Set();
  let gpu = 0;
  const add = a => {
    const arr = a && (a.isInterleavedBufferAttribute ? a.data.array : a.array);
    if (arr && !seen.has(arr)) { seen.add(arr); gpu += arr.byteLength; }
  };
  scene.traverse(o => {
    const g = o.geometry;
    if (!g) return;
    for (const k in g.attributes) add(g.attributes[k]);
    add(g.index);
    if (o.isInstancedMesh) { add(o.instanceMatrix); add(o.instanceColor); }
  });
  return {gpu, data: dataBytes, pick: sx.byteLength * 3};
}
const mb = b => (b / 2**20).toFixed(1) + ' MB';
async function load(refit) {
  const seq = ++loadSeq;
  $('pp').classList.add('busy');
  const t0 = performance.now();
  let data, det;
  try {
    let text;
    [text, det] = await Promise.all([fetch('/data.json?' + showQS()).then(r => r.text()), fetch('/projects').then(r => r.json())]);
    dataBytes = text.length; // ASCII JSON: characters = bytes
    data = JSON.parse(text);
  } finally {
    if (seq === loadSeq) $('pp').classList.remove('busy');
  }
  if (seq !== loadSeq) return; // a newer toggle already asked for another layout
  detected = det.projects || []; workspace = det.workspace;
  const tFetch = performance.now() - t0;
  D = data; N = D.name.length; P = D.projects.length;
  pcol = D.projects.map(color); // by name, so a project keeps its colour whatever else is added

  stars = drop(stars); calls = drop(calls); grpc = drop(grpc); hl = drop(hl);
  stars = new THREE.InstancedMesh(new THREE.PlaneGeometry(2, 2), starMaterial, Math.max(N, 1));
  stars.count = N;
  for (let i = 0; i < N; i++) {
    v.set(D.pos[3*i], D.pos[3*i+1], D.pos[3*i+2]);
    stars.setMatrixAt(i, m4.compose(v, q4, s3.setScalar(0.35 + 0.3 * Math.log2(1 + D.deg[i]))));
    stars.setColorAt(i, pcol[D.proj[i]]);
  }
  // Faint lines only read as structure when there are thousands; a few dozen need to be bright.
  CALL_OPACITY = Math.min(0.6, Math.max(0.07, 20 / Math.sqrt(D.edges.length / 2 || 1)));
  calls = segments(D.edges, k => pcol[D.proj[D.edges[k]]], CALL_OPACITY);
  grpc = segments(D.grpc, () => GRPC, GRPC_OPACITY);
  calls.visible = $('showCalls').checked; grpc.visible = $('showGrpc').checked;
  scene.add(stars, calls, grpc);

  out = Array.from({length: N}, () => []); inn = Array.from({length: N}, () => []);
  for (let k = 0; k < D.edges.length; k += 2) { out[D.edges[k]].push([D.edges[k+1], 'call']); inn[D.edges[k+1]].push([D.edges[k], 'call']); }
  for (let k = 0; k < D.grpc.length; k += 2) { const m = 'grpc ' + D.methods[k/2]; out[D.grpc[k]].push([D.grpc[k+1], m]); inn[D.grpc[k+1]].push([D.grpc[k], m]); }

  R = 1;
  for (let i = 0; i < N; i++) R = Math.max(R, Math.hypot(D.pos[3*i], D.pos[3*i+1], D.pos[3*i+2]));
  if (refit) { const h = hub(); controls.target.copy(h); camera.position.set(h.x, h.y + R * 0.6, h.z + R * 2.2); }
  else flyTo(hub(), R * 2.3);

  $('labels').innerHTML = '';
  labels = D.projects.map((p, i) => {
    const el = document.createElement('div');
    el.className = 'lbl'; el.textContent = p; el.style.color = '#' + pcol[i].getHexString();
    $('labels').appendChild(el); return el;
  });

  renderProjects();
  $('empty').style.display = N ? 'none' : 'block';
  const cur = $('qp').value;
  $('qp').innerHTML = '<option value="-1">in all projects</option>' + D.projects.map((p, i) => D.hidden[i] ? '' : `<option value="${i}">in ${esc(p)}</option>`).join('');
  $('qp').value = cur >= 0 && !D.hidden[cur] ? cur : -1;

  const shown = D.hidden.filter(h => !h).length;
  $('stats').innerHTML = `${shown} project${shown === 1 ? '' : 's'} shown · ${added.size} added · ${detected.length} detected<br>`
    + `${shown}/${P} indexed projects · ${N.toLocaleString()} functions${D.limit && D.total > N ? ` <span style="color:#ffa63d" title="the server keeps functions linked to another project first, then the most connected; the rest are never sent">(top ${N.toLocaleString()} of ${D.total.toLocaleString()})</span>` : ''}<br>${(D.edges.length/2).toLocaleString()} calls · ${(D.grpc.length/2).toLocaleString()} gRPC hops<br>
    layout ${D.layoutMs} ms (Go) · fetch ${tFetch.toFixed(0)} ms · build ${(performance.now() - t0 - tFetch).toFixed(0)} ms<br>
    <span class="muted">left-drag: orbit · right-drag: pan · wheel: zoom · f: fit · Esc: clear</span>`;
  idOf = new Map(D.id.map((g, i) => [g, i]));
  keyOf = new Map(D.name.map((_, i) => [nodeKey(i), i]));
  hay = D.name.map((n, i) => (n + ' ' + D.projects[D.proj[i]]).toLowerCase());
  closeMenu();
  for (const f of ['a', 'b']) if (ends[f] !== null && !keyOf.has(ends[f])) ends[f] = null; // its project left the overview
  focus = null;
  projected = false; hover = -1; $('tip').style.display = 'none';
  $('q').oninput();
  findRoutes();
}

// Project panel (top right): every project detected in the workspace. Nothing is
// in the overview until you press Sync, which re-indexes the project and adds it.
// Added projects get a checkbox (show/hide), Sync again to re-index, × to remove.
// The search box filters the list; all/none apply to added projects it matches.
const ago = t => { const s = (Date.now() - Date.parse(t)) / 1000; return s < 90 ? 'just now' : s < 5400 ? `${Math.round(s / 60)} min ago` : s < 129600 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`; };
const matching = () => { const s = $('pq').value.toLowerCase(); return [...added].filter(p => p.toLowerCase().includes(s)); };
let famOf = r => [r]; // project -> [project, ...its modules], rebuilt by renderProjects
const openMods = new Set(JSON.parse(localStorage.getItem('dw.openMods') || '[]'));
function renderProjects() {
  const s = $('pq').value.toLowerCase();

let routes = [], routeSel = 0, routeObjs = [], routeSeq = 0;
const markers = {};
for (const [f, col] of [['a', '#3ddc84'], ['b', '#ff5a5a']]) {
  const el = document.createElement('div'); el.className = 'mk'; el.style.background = col; el.style.display = 'none';
  el.innerHTML = `<span>${f.toUpperCase()}</span>`; $('markers').appendChild(el); markers[f] = el;
}
const HOP = {call: ['→', 'call', 'call'], 'iface:sure': ['⇢', 'sure', 'interface call, sure'], 'iface:guess': ['?', 'guess', 'interface call, guess'], grpc: ['✈', 'grpc', 'gRPC']};
const HOPCOL = {call: new THREE.Color('#4c8dff'), 'iface:sure': new THREE.Color('#4c8dff'), 'iface:guess': new THREE.Color('#ffa63d'), grpc: new THREE.Color('#ff4fe8')};
const ALT = new THREE.Color('#7d8fb8'), CASING = new THREE.Color('#0b1f4d');

const endIdx = f => ends[f] === null ? undefined : keyOf.get(ends[f]);
function renderEnds() {
  for (const f of ['a', 'b']) {
    const inp = $('f' + f).querySelector('input'), i = endIdx(f);
    if (document.activeElement !== inp) inp.value = i === undefined ? '' : D.name[i];
    inp.title = i === undefined ? '' : where(i);
  }
}
function setEnd(f, i) {
  ends[f] = nodeKey(i);
  findRoutes();
}

// A/B typeahead: every whitespace-separated word must appear in the function name
// or its project ("scoring-system score" finds score* in scoring-system only).
// Exact names first, then Type.name suffix matches, then the most connected.
let hay = [];
function matchNodes(q, limit) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const last = words[words.length - 1], hits = [];
  for (let i = 0; i < N; i++) if (words.every(w => hay[i].includes(w))) hits.push(i);
  const rank = i => { const n = D.name[i].toLowerCase(); return n === last ? 0 : n.endsWith('.' + last) ? 1 : n.includes(last) ? 2 : 3; };
  hits.sort((x, y) => rank(x) - rank(y) || D.deg[y] - D.deg[x]);
  return hits.slice(0, limit);
}
for (const f of ['a', 'b']) {
  const inp = $('f' + f).querySelector('input'), dd = $('dd' + f);
  let opts = [], hi = 0;
  const show = () => {
    dd.innerHTML = opts.length ? opts.map((i, k) => `<div class="row${k === hi ? ' hi' : ''}" data-k="${k}" title="${esc(where(i))}">${swatch(i)}${esc(D.name[i])}<span class="n">${esc(D.projects[D.proj[i]])}</span></div>`).join('')
      : '<div class="row muted">no match</div>';
    dd.style.display = inp.value.trim() ? 'block' : 'none';
  };
  const choose = k => {
    const i = opts[k]; if (i === undefined) return;
    dd.style.display = 'none';
    inp.value = D.name[i];
    setEnd(f, i);
    if (f === 'a' && ends.b === null) $('fb').querySelector('input').focus(); // like maps: then ask for the destination
    else inp.blur();
  };
  inp.oninput = () => { opts = D ? matchNodes(inp.value, 12) : []; hi = 0; show(); };
  inp.onfocus = () => inp.select();
  inp.onblur = () => setTimeout(() => { dd.style.display = 'none'; renderEnds(); }, 150);
  inp.onkeydown = e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); hi = Math.max(0, Math.min(opts.length - 1, hi + (e.key === 'ArrowDown' ? 1 : -1))); show(); }
    else if (e.key === 'Enter') choose(hi);
    else if (e.key === 'Escape') inp.blur();
  };
  dd.onmousedown = e => { e.preventDefault(); const r = e.target.closest('[data-k]'); if (r) choose(+r.dataset.k); }; // mousedown: before blur closes the list
  $('f' + f).querySelector('.x').onclick = () => { ends[f] = null; inp.value = ''; findRoutes(); inp.focus(); };
}

// Star context menu: opens left of the cursor on a click.
let menuNode = -1;
function openMenu(i, x, y) {
  menuNode = i;
  const p = D.projects[D.proj[i]], pi = D.proj[i];
  const it = (act, ic, label) => `<div class="it" data-act="${act}"><span class="ic">${ic}</span>${label}</div>`;
  const m = $('ctx');
  m.innerHTML = `<div class="hd">${swatch(i)} <b>${esc(D.name[i])}</b><div class="muted">${esc(where(i))}</div><div class="muted">${inn[i].length} callers · ${out[i].length} callees</div></div>`
    + it('focus', '◎', 'Show callers and callees')
    + it('from', '<span class="pin a" style="display:inline-flex;width:13px;height:13px;font-size:9px">A</span>', 'Directions from here')
    + it('to', '<span class="pin b" style="display:inline-flex;width:13px;height:13px;font-size:9px">B</span>', 'Directions to here')
    + it('fly', '⌖', 'Fly here')
    + it('search', '⌕', `Search in ${esc(p)}`)
    + it('hide', '⊘', `Hide project ${esc(p)}`);
  m.style.display = 'block';
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, x - w - 14) + 'px';
  m.style.top = Math.max(8, Math.min(innerHeight - h - 8, y - 20)) + 'px';
  $('tip').style.display = 'none';
}
function closeMenu() { menuNode = -1; $('ctx').style.display = 'none'; }
$('ctx').onclick = e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const i = menuNode; closeMenu();
  const p = D.projects[D.proj[i]];
  switch (a.dataset.act) {
    case 'focus': return setFocus({node: i});
    case 'from': return setEnd('a', i);
    case 'to': return setEnd('b', i);
    case 'fly': return flyTo(nodePos(i), 60);
    case 'search': $('qp').value = D.proj[i]; $('q').focus(); return $('q').oninput();
    case 'hide': hidden.add(p); return saveHidden();
  }
};
$('swap').onclick = () => { [ends.a, ends.b] = [ends.b, ends.a]; findRoutes(); };

function routeNodes() {
  const s = new Set();
  for (const r of routes) for (const i of r.idx) s.add(i);
  return s;
}
async function findRoutes() {
  const seq = ++routeSeq;
  renderEnds();
  routes = []; routeSel = 0; drawRoutes();
  if (ends.a === null || ends.b === null) { $('routes').innerHTML = ''; return setFocus(focus); }
  if (ends.a === ends.b) { $('routes').innerHTML = '<div class="muted">start and destination are the same function</div>'; return setFocus(focus); }
  $('routes').innerHTML = '<div class="muted">finding routes…</div>';
  const res = await (await fetch(`/route?a=${D.id[endIdx('a')]}&b=${D.id[endIdx('b')]}&k=5&${showQS()}`)).json();
  if (seq !== routeSeq) return;
  routes = (res.routes || []).map(r => ({...r, idx: r.nodes.map(g => idOf.get(g))}));
  if (!routes.length) {
    $('routes').innerHTML = `<div class="muted">no route found${res.exhausted ? '' : ' (search limit hit: a route may still exist)'}</div>`;
    return setFocus(focus);
  }
  $('routes').dataset.ms = res.ms;
  selectRoute(0);
}
function selectRoute(k) {
  routeSel = k;
  drawRoutes();
  renderRoutes();
  setFocus(focus);
  const r = routes[k], box = new THREE.Box3();
  for (const i of r.idx) box.expandByPoint(nodePos(i));
  const sph = box.getBoundingSphere(new THREE.Sphere());
  flyTo(sph.center, Math.max(60, sph.radius * 2.6));
}
function lineObj(segs, colors, width, order) {
  const g = new LineSegmentsGeometry();
  g.setPositions(segs); g.setColors(colors);
  const m = new LineMaterial({linewidth: width, vertexColors: true, transparent: true, depthTest: false});
  m.resolution.set(innerWidth, innerHeight);
  const o = new LineSegments2(g, m); o.renderOrder = order;
  scene.add(o); routeObjs.push(o);
  return o;
}
function drawRoutes() {
  for (const o of routeObjs) { scene.remove(o); o.geometry.dispose(); o.material.dispose(); }
  routeObjs = [];
  const build = (r, colorOf) => {
    const segs = [], cols = [];
    for (let h = 0; h < r.via.length; h++) {
      const s = r.idx[h], t = r.idx[h+1], c = colorOf(h);
      segs.push(D.pos[3*s], D.pos[3*s+1], D.pos[3*s+2], D.pos[3*t], D.pos[3*t+1], D.pos[3*t+2]);
      cols.push(c.r, c.g, c.b, c.r, c.g, c.b);
    }
    return [segs, cols];
  };
  routes.forEach((r, k) => {
    if (k === routeSel) return;
    const [segs, cols] = build(r, () => ALT);
    lineObj(segs, cols, 4, 10).material.opacity = 0.75;
  });
  if (routes[routeSel]) {
    const r = routes[routeSel];
    const [segs, casing] = build(r, () => CASING);
    lineObj(segs, casing, 10, 11); // dark casing under the coloured line, as on a map
    lineObj(segs, build(r, h => HOPCOL[r.via[h]])[1], 6, 12);
  }
}
function routeSummary(r) {
  const grpcN = r.via.filter(v => v === 'grpc').length, guesses = r.via.filter(v => v === 'iface:guess').length;
  const projs = [];
  for (const i of r.idx) { const p = D.projects[D.proj[i]]; if (projs[projs.length - 1] !== p) projs.push(p); }
  return {hops: r.via.length, grpcN, guesses, projs};
}
function renderRoutes() {
  $('routes').innerHTML = routes.map((r, k) => {
    const s = routeSummary(r);
    const head = `<div class="t">${k === 0 ? 'Best route' : 'Route ' + (k + 1)} · ${s.hops} hops</div>
      <div class="m">${s.guesses ? `<span style="color:#ffa63d">${s.guesses} guess${s.guesses > 1 ? 'es' : ''}</span>` : 'no guesses'} · ${r.sure}/${r.iface} iface sure${s.grpcN ? ` · <span style="color:#ff4fe8">${s.grpcN} gRPC</span>` : ''}</div>
      <div class="m">${s.projs.map(esc).join(' → ')}</div>`;
    if (k !== routeSel) return `<div class="rt" data-r="${k}">${head}</div>`;
    const steps = r.idx.map((i, h) => {
      const hop = h === 0 ? '' : (() => { const [ic, cl, title] = HOP[r.via[h-1]]; return `<div class="step"><span class="ic ${cl}" title="${title}">${ic}</span><span class="m">${esc(title)}${r.methods[h-1] ? ' ' + esc(r.methods[h-1]) : ''}</span></div>`; })();
      const pin = h === 0 ? '<span class="pin a">A</span>' : h === r.idx.length - 1 ? '<span class="pin b">B</span>' : '<span class="ic">·</span>';
      return hop + `<div class="step">${pin}${nodeRow(i, '', '')}</div>`;
    }).join('');
    return `<div class="rt sel" data-r="${k}">${head}<div style="margin-top:6px">${steps}</div></div>`;
  }).join('') + `<div class="muted">${routes.length} route${routes.length > 1 ? 's' : ''} in ${$('routes').dataset.ms} ms · fewest guesses first, then fewest hops</div>`;
}
$('routes').onclick = e => {
  const n = e.target.closest('[data-n]');
  if (n) { const j = +n.dataset.n; setFocus({node: j}); flyTo(nodePos(j), 60); return; }
  const r = e.target.closest('[data-r]'); if (r && +r.dataset.r !== routeSel) selectRoute(+r.dataset.r);
};
// Clicking near an alternative route's line selects it (within 6px, screen space).
function pickRoute(mx, my) {
  if (!projected) project();
  let best = -1, bd = 36;
  routes.forEach((r, k) => {
    if (k === routeSel) return;
    for (let h = 0; h < r.via.length; h++) {
      const s = r.idx[h], t = r.idx[h+1];
      if (sz[s] <= 0 || sz[t] <= 0) continue;
      const ax = sx[s], ay = sy[s], dx = sx[t] - ax, dy = sy[t] - ay, L = dx*dx + dy*dy;
      const u = L ? Math.max(0, Math.min(1, ((mx - ax)*dx + (my - ay)*dy) / L)) : 0;
      const ex = ax + u*dx - mx, ey = ay + u*dy - my, d = ex*ex + ey*ey;
      if (d < bd) { bd = d; best = k; }
    }
  });
  return best;
}

$('reset').onclick = () => {
  ends.a = ends.b = null; closeMenu();
  $('q').value = ''; $('qp').value = -1; $('pq').value = '';
  for (const id of ['showCalls', 'showGrpc', 'showLabels']) $(id).checked = true;
  $('labels').style.display = '';
  focus = null;
  hidden.clear(); saveSets();
  load(true); // relayout with every added project, fit the camera, re-run (now empty) directions
};

let frames = 0, last = performance.now(), worst = 0, prev = last;
const pv = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  worst = Math.max(worst, now - prev); prev = now;
  if (anim) {
    anim.t = Math.min(1, anim.t + 0.04);
    const k = 1 - Math.pow(1 - anim.t, 3);
    controls.target.lerpVectors(anim.fromT, anim.toT, k);
    camera.position.lerpVectors(anim.fromP, anim.toP, k);
    projected = false;
    if (anim.t === 1) anim = null;
  }
  controls.update();
  renderer.render(scene, camera);
  if (!D) return;
  if (!projected) project();
  if (namesGen !== projGen) drawNames();
  if ($('labels').style.display !== 'none') {
    for (let i = 0; i < P; i++) {
      pv.set(D.centers[3*i], D.centers[3*i+1], D.centers[3*i+2]).project(camera);
      const el = labels[i];
      if (D.hidden[i] || pv.z > 1 || Math.abs(pv.x) > 1.1 || Math.abs(pv.y) > 1.1) { el.style.display = 'none'; continue; }
      el.style.display = '';
      el.style.left = ((pv.x + 1) / 2 * innerWidth) + 'px';
      el.style.top = ((1 - pv.y) / 2 * innerHeight) + 'px';
    }
  }
  for (const f of ['a', 'b']) {
    const el = markers[f], i = endIdx(f);
    if (i === undefined) { el.style.display = 'none'; continue; }
    pv.set(D.pos[3*i], D.pos[3*i+1], D.pos[3*i+2]).project(camera);
    if (pv.z > 1) { el.style.display = 'none'; continue; }
    el.style.display = ''; el.style.left = ((pv.x + 1) / 2 * innerWidth) + 'px'; el.style.top = ((1 - pv.y) / 2 * innerHeight) + 'px';
  }
  if (mouse) {
    const i = pickNode(mouse[0], mouse[1]);
    if (i !== hover) {
      hover = i;
      const tip = $('tip');
      if (i < 0) tip.style.display = 'none';
      else { tip.innerHTML = `<b>${esc(D.name[i])}</b><br>${esc(where(i))}<br><span class="muted">${out[i].length} callees · ${inn[i].length} callers</span>`; tip.style.display = 'block'; }
    }
    if (hover >= 0) { $('tip').style.left = (mouse[0] + 14) + 'px'; $('tip').style.top = (mouse[1] + 14) + 'px'; }
  }
  frames++;
  if (now - last > 1000) { // Only Chromium exposes the tab's JS heap; Safari and Firefox expose no memory figure at all.
    const own = pageBytes();
    const heap = performance.memory ? `JS heap ${(performance.memory.usedJSHeapSize / 2**20).toFixed(0)} MB` : '<span title="not exposed by this browser" style="cursor:help">RAM: N/A</span>';
    const mem = `${heap} · <span title="ERAM: estimated RAM, what this page allocated itself, not the whole tab&#10;geometry buffers (GPU + JS copy): ${mb(own.gpu)}&#10;layout JSON: ${mb(own.data)}&#10;picking arrays: ${mb(own.pick)}" style="cursor:help">ERAM ${mb(own.gpu + own.data + own.pick)}</span>`;
    $('rate').innerHTML = `${frames} fps · worst frame ${worst.toFixed(0)} ms · ${mem}`; frames = 0; last = now; worst = 0; }
}
requestAnimationFrame(frame);
load(true);
</script>
</body></html>
