<!doctype html>
<html><head><meta charset="utf-8"><title>dotweavier trace field</title>
<style>
html,body{margin:0;height:100%;background:#02030a;color:#cdd5ff;font:12px/1.45 ui-monospace,Menlo,monospace;overflow:hidden}
svg{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
/* Bottom panel, full width: call path on top, then controls | details, then the kinds legend. */
#dock{position:absolute;left:0;right:0;bottom:0;z-index:2;max-height:45vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(10,12,32,.94),rgba(5,6,18,.92));border-top:1px solid #1b2045;backdrop-filter:blur(6px)}
#side{display:flex;gap:16px;min-height:0;padding:10px 14px;box-sizing:border-box}
#side .ctl{flex:0 0 340px;overflow:auto}
#det{flex:1 1 auto;min-width:0;overflow:auto}
h1{margin:0 0 6px;font-size:13px;letter-spacing:.2em;color:#fff}
.ep{color:#8b93c4;font-size:11px;word-break:break-all;margin:2px 0}
.hint{color:#5d6596;font-size:11px;margin:10px 0 4px}
/* History: hamburger menu, top left. */
#menuBtn{position:absolute;top:10px;left:10px;z-index:3;width:30px;height:28px;padding:0;font-size:16px;line-height:26px}
#hist{position:absolute;top:44px;left:10px;z-index:3;width:min(520px,calc(100% - 20px));max-height:60vh;overflow:auto;display:none;
  background:rgba(8,10,28,.97);border:1px solid #2a3166;border-radius:8px;box-shadow:0 6px 24px #000}
#hist.open{display:block}#hist .ttl{padding:6px 10px;color:#5d6596;font-size:11px;border-bottom:1px solid #1b2045}
#hist .hr{padding:4px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
#hist .hr:hover{background:#141a3d}#hist .hr.cur{background:#1d2456;color:#fff}
#hist .at{color:#5d6596}
input{width:100%;box-sizing:border-box;margin:8px 0 4px;padding:6px 8px;background:#0a0d24;border:1px solid #2a3166;border-radius:6px;color:#fff;font:inherit}
button{background:#141a3d;border:1px solid #2a3166;color:#cdd5ff;border-radius:6px;padding:3px 8px;font:inherit;font-size:11px;cursor:pointer;margin:2px 2px 2px 0}
button:hover{border-color:#6b78d8}
.lg{display:inline-flex;align-items:center;gap:5px;margin:2px 10px 2px 0;font-size:11px}
.lg i{width:9px;height:9px;border-radius:2px;display:inline-block}
#calls{box-sizing:border-box;padding:8px 12px;border-bottom:1px solid #1b2045;white-space:nowrap;overflow-x:auto;display:none}
#legend{padding:5px 14px;white-space:nowrap;overflow-x:auto;border-top:1px solid #1b2045}
#calls .fn{display:inline-block;padding:2px 8px;border:1px solid #2b3270;border-radius:10px;color:#fff;cursor:pointer}
#calls .fn:hover{border-color:#8b93c4}#calls .fn.cur{border-color:#fff}
#calls .hop{color:#8b93c4;margin:0 6px;font-size:10px}
#det .ctx{color:#8b93c4}
.ln{display:inline-block;min-width:3.5em;margin-right:10px;text-align:right;color:#4a527e;user-select:none}
#viewer{position:absolute;inset:30px 40px;z-index:5;display:none;flex-direction:column;background:#060818;border:1px solid #2a3166;border-radius:8px;box-shadow:0 10px 40px #000}
#viewer.open{display:flex}
#viewer .vh{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid #1b2045;color:#fff}
#viewer .vh span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewer pre{flex:1;margin:0;padding:8px 0;overflow:auto;color:#cdd5ff;white-space:pre}
#viewer pre div{padding:0 12px 0 4px}
#viewer .tr{display:inline-block;width:16px;margin-right:4px;color:#ff7ad9;cursor:pointer;visibility:hidden;user-select:none}
#viewer pre div:hover .tr,#viewer pre div.hl .tr{visibility:visible}#viewer .tr:hover{color:#fff}#viewer pre div.hl{background:#1d2456;color:#fff}
#det{padding:9px;border:1px solid #1b2045;border-radius:7px;word-break:break-all}
#det .k{font-size:10px;padding:0 6px;border-radius:9px;color:#02030a}
#det .row{margin:4px 0;color:#9aa2d0}#det .row b{color:#fff;font-weight:normal}
#det pre{white-space:pre-wrap;margin:6px 0 0;padding:6px;background:#080b1e;border-radius:5px;color:#e6e9ff}
.node rect{rx:7;stroke-width:1.2}
.node text{font:11px ui-monospace,Menlo,monospace;pointer-events:none}
.node .t1{fill:#fff}.node .t2{fill:#9aa2d0}
.node.dim{opacity:.25}.node.hit rect{stroke:#fff!important;stroke-width:2.4}
.node.sel rect{filter:drop-shadow(0 0 8px #a9b6ff)}
.edge{fill:none;stroke-width:1.4;opacity:.7}
.edge.dim,.proj.dim{opacity:.25}
/* Search: project chip before the input; results list opens upward from the input, 10 rows at a time. */
#qbox{display:flex;align-items:center;gap:6px}#qbox input{flex:1;min-width:0}
#chip{display:inline-flex;gap:4px;margin:8px 0 4px;padding:4px 8px;white-space:nowrap;border:1px solid #6b78d8;border-radius:10px;color:#fff}#chip[hidden]{display:none}
#chip b{cursor:pointer;font-weight:normal;color:#8b93c4}#chip b:hover{color:#fff}
#res{position:fixed;z-index:4;width:520px;max-width:calc(100% - 20px);display:none;background:rgba(8,10,28,.97);border:1px solid #2a3166;border-radius:8px;box-shadow:0 6px 24px #000}
#res .rr{padding:3px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
#res .rr:hover{background:#141a3d}#res .rr.cur{background:#1d2456;color:#fff}
#res .at{color:#5d6596}#res .ttl{padding:4px 10px;color:#5d6596;font-size:11px;border-top:1px solid #1b2045}
.proj rect{fill-opacity:.05;stroke-opacity:.55;stroke-width:1.2;stroke-dasharray:6 4}
.proj text{font:11px ui-monospace,Menlo,monospace;letter-spacing:.1em;fill-opacity:.8}
.cap{font:12px ui-monospace,Menlo,monospace;letter-spacing:.2em;fill:#5d6596}
</style></head>
<body>
<svg id="svg"><defs></defs><g id="g"></g></svg>
<button id="menuBtn" title="history of field traces">☰</button><div id="hist"></div><div id="viewer"><div class="vh"><span id="vTitle"></span><span id="vMsg" class="hint" style="flex:0 1 auto;margin:0"></span><button id="vClose">close · esc</button></div><pre id="vBody"></pre></div><div id="res"></div><div id="dock"><div id="calls"></div><div id="side"></div><div id="legend"></div></div>
<script>
// The server lists and serves the kept runs; an exported page carries its run inline.
const P=new URLSearchParams(location.search);
let traceName=P.get('t')||''; // '' opens the newest run
const OPEN=+P.get('open')||window.OPEN||0; // levels open at first; 0: the page's default
const keepOpen=OPEN?{open:OPEN}:{};
// History menu: every kept run, newest first; the open run is highlighted.
function buildMenu(H){const m=document.getElementById('hist'), btn=document.getElementById('menuBtn');
  m.innerHTML=`<div class="ttl">history · ${H.length} run${H.length===1?'':'s'}, newest first</div>`+(H.map(h=>`<div class="hr${h.name===traceName?' cur':''}" data-t="${escH(h.name)}" title="${escH(h.name)}"><span class="at">${escH(String(h.at).slice(0,19).replace('T',' '))}</span> ${escH(h.addr||h.name)}</div>`).join('')||'<div class="hr">no runs yet</div>');
  btn.onclick=e=>{e.stopPropagation(); m.classList.toggle('open');};
  m.onclick=e=>{const r=e.target.closest('[data-t]'); if(r)location.search='?t='+encodeURIComponent(r.dataset.t);};
  addEventListener('mousedown',e=>{if(!m.contains(e.target)&&e.target!==btn)m.classList.remove('open');});
  addEventListener('keydown',e=>{if(e.key==='Escape')m.classList.remove('open');});}
const escH=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// An exported page (--format html, or the export button) carries its run inline: no history, no server.
if(window.EXPORTED){document.getElementById('menuBtn').remove(); start(window.TRACE);}
else Promise.all([fetch('/trace-field/runs').then(r=>r.ok?r.json():[]),fetch('/trace-field/run?'+new URLSearchParams({run:traceName})).then(r=>r.ok?r.json():null)])
  .then(([H,R])=>{if(!R)return noData(); traceName=R.Name; buildMenu(H||[]); start(R);},noData);
function noData(){document.body.insertAdjacentHTML('beforeend',`<div style="position:absolute;inset:40% 0 auto;text-align:center;color:#ff7a7a">no field trace run ${escH(traceName)}<br><span style="color:#8b93c4">run: dotweavier trace field ADDR --format ui</span></div>`);}
// R is a domain FieldRun; it keeps both trees, and Only says which one the page shows.
function start(R){
const D={addr:R.Addr||'', only:R.Only||'', maxProjects:R.MaxProjects, includeTests:R.IncludeTests,
  origin:R.Only==='uses'?[]:R.Origin||[], uses:R.Only==='origin'?[]:R.Uses||[]};
// Served by `dotweavier overview`, the page can run traces; from file:// it only shows them.
const served=location.protocol.startsWith('http')&&!window.EXPORTED;
const home=(D.addr.match(/^([^:]+):[^:]+\.(go|java|kt):\d+$/)||[])[1]||'';
const KIND = {seed:'#ffffff',assign:'#6878b8',convert:'#6be4ff',transform:'#ffd06b',arg:'#7aa2ff',return:'#b88bff',
  store:'#ff9b6b',read:'#6dffc6',field:'#ff7ad9',container:'#c4ff6b',capture:'#9aa2d0','callback?':'#ffb35c',overwritten:'#ff5c5c',
  grpc:'#ff4fe8',http:'#ff8c4f',pubsub:'#c88bff','pubsub:guess':'#a77bd6'};
const mk=k=>'a'+k.replace(/[^a-z]/g,''); // marker id per kind
const NW=300, NH=40, COL=360, ROW=52;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cut=(s,n)=>s&&s.length>n?s.slice(0,n-1)+'…':(s||'');

// ---- model: center = seed; origin kids grow left (side -1), uses kids grow right (side 1) ----
let all=[];
// Open the first levels; a step with one way on stays open so chains read through; one with over 15 starts closed.
function wrap(d,side,depth,parent,j){const nk=(d.kids||[]).length, n={d,side,depth,parent,path:parent.path.concat(j),open:nk<=15&&(depth<(OPEN||6)||nk<=1||isHop(d)),kids:[]}; all.push(n);
  n.kids=(d.kids||[]).map((k,j)=>wrap(k,side,depth+1,n,j)); return n;}
const isHop=d=>/^(grpc|http|pubsub)/.test(d.kind);
const openHops=d=>(d.hops||[]).filter(h=>!h.followed).length;
const centers=[];
// Seeds come from the uses tree; a run traced with --only origin has only the origin tree,
// and its hops cannot be followed (follow looks steps up in the uses tree).
const fromUses=(D.uses||[]).length>0;
(fromUses?D.uses:(D.origin||[])).forEach((u,i)=>{const o=fromUses?(D.origin||[]).find(o=>o.loc===u.loc)||{kids:[]}:u;
  const c={d:fromUses?u:{...u,hops:[]},side:0,depth:0,parent:null,path:[i],open:true,kids:[]}; all.push(c);
  c.left=(o.kids||[]).map((k,j)=>wrap(k,-1,1,{path:[]},j)); c.left.forEach(k=>k.parent=c); c.right=fromUses?(u.kids||[]).map((k,j)=>wrap(k,1,1,c,j)):[]; centers.push(c);});
// Search text and project are fixed per step, so they are computed once instead of on every query.
all.forEach(n=>{n.hay=JSON.stringify({...n.d,kids:0}).toLowerCase(); n.p=proj(n);});
const nOrigin=all.filter(n=>n.side<0).length, nUses=all.filter(n=>n.side>0).length;

// ---- layout: tidy tree per side, leaves stacked, parents centered on their children ----
// A step entering another project gets a gap above and below its subtree, room for the project outline and name.
const GAP=ROW;
function place(n,x,next){n.x=x; const ks=n.open?n.kids:[], enter=n.parent&&proj(n)!==proj(n.parent);
  if(enter)next.y+=GAP;
  if(!ks.length){n.y=next.y; next.y+=ROW;}
  else{ks.forEach(k=>place(k,x+n.side*COL,next)); n.y=(ks[0].y+ks.at(-1).y)/2;}
  if(enter)next.y+=GAP;}
function shift(n,dy){n.y+=dy; if(n.open)n.kids.forEach(k=>shift(k,dy));}
function layout(){let top=0;
  for(const c of centers){c.x=0;
    const sides=[[c.left,-1],[c.right,1]].map(([ks,side])=>{const next={y:0}; ks.forEach(k=>place(k,side*COL,next)); return {ks,h:Math.max(next.y,ROW)};});
    const h=Math.max(sides[0].h,sides[1].h); c.y=top+h/2-ROW/2;
    sides.forEach(s=>{if(!s.ks.length)return; const mid=(s.ks[0].y+s.ks.at(-1).y)/2; s.ks.forEach(k=>shift(k,c.y-mid));});
    top+=h+ROW*2;}
}

// ---- view ----
const svg=document.getElementById('svg'), g=document.getElementById('g');
const view={x:0,y:0,k:1}; const apply=()=>g.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);
let sel=null;
function visible(){const out=[]; const walk=n=>{out.push(n); if(n.open)n.kids.forEach(walk);};
  centers.forEach(c=>{out.push(c); c.left.forEach(walk); c.right.forEach(walk);}); return out;}
// Project of a step: "proj:file:line" names it, home locations are "file:line", fields inherit their parent's.
function proj(n){const l=(n.d.loc||'').split(':'); return l.length===3?l[0]:l.length===2?home:n.parent?proj(n.parent):home;}
const PCOL=['#6be4ff','#ffd06b','#6dffc6','#ff9b6b','#b88bff','#c4ff6b','#ff7ad9','#7aa2ff'], pcol={};
// One outline per connected run of same-project steps, so a call into another service shows as a boundary.
function outlines(vs){const ps=new Set(vs.map(proj)); if(ps.size<2)return '';
  const box=new Map(); for(const n of vs){let r=n; while(r.parent&&proj(r.parent)===proj(n))r=r.parent;
    const b=box.get(r)||{p:proj(n),x0:1e9,y0:1e9,x1:-1e9,y1:-1e9}; box.set(r,b);
    b.x0=Math.min(b.x0,n.x-NW/2); b.x1=Math.max(b.x1,n.x+NW/2); b.y0=Math.min(b.y0,n.y-NH/2); b.y1=Math.max(b.y1,n.y+NH/2);}
  let h='', P=14; for(const b of box.values()){const c=pcol[b.p]??=PCOL[Object.keys(pcol).length%PCOL.length];
    h+=`<g class="proj${scope!==null&&b.p!==scope?' dim':''}"><rect x="${b.x0-P}" y="${b.y0-P-12}" width="${b.x1-b.x0+2*P}" height="${b.y1-b.y0+2*P+12}" rx="10" fill="${c}" stroke="${c}"/><text x="${b.x0-P+8}" y="${b.y0-P+1}" fill="${c}">${esc(b.p||'?')}</text></g>`;}
  return h;}
function title(n){const d=n.d; return d.kind==='field'?d.name:d.loc;}
function draw(){layout(); const vs=visible();
  let h='<text class="cap" x="'+(-COL+NW/2-150)+'" y="-40">◀ ORIGIN</text><text class="cap" x="'+(COL)+'" y="-40">LIFECYCLE ▶</text>'+outlines(vs);
  for(const n of vs){const p=n.parent; if(!p)continue;
    const c=KIND[n.d.kind]||'#888';
    // origin edges run child -> parent, lifecycle edges parent -> child
    let x1,x2; if(n.side<0){x1=n.x+NW/2; x2=p.x-NW/2;} else {x1=p.x+NW/2; x2=n.x-NW/2;}
    const [y1,y2]=n.side<0?[n.y,p.y]:[p.y,n.y], mx=(x1+x2)/2;
    h+=`<path class="edge${dimmed(n)?' dim':''}" stroke="${c}" ${n.d.kind==='overwritten'||n.d.kind==='callback?'?'stroke-dasharray="5 4"':''} d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" marker-end="url(#${mk(n.d.kind)})"/>`;}
  vs.forEach((n,i)=>{const d=n.d, c=KIND[d.kind]||'#888', dim=dimmed(n), match=dimQ&&!dim;
    const more=!n.open&&n.kids.length?` ▸${count(n)}`:'';
    const line2=d.kind==='field'?(d.type||''):cut(d.code,44);
    h+=`<g class="node ${dim?'dim':''} ${match?'hit':''} ${sel===n?'sel':''}" data-i="${i}" transform="translate(${n.x-NW/2},${n.y-NH/2})">
      <rect width="${NW}" height="${NH}" fill="${d.kind==='field'?'#2a0f2d':'#0b0f2a'}" stroke="${c}" ${d.kind==='overwritten'?'stroke-dasharray="4 3"':''}/>
      <rect width="5" height="${NH}" fill="${c}" stroke="none" rx="2"/>
      <text class="t1" x="12" y="16"><tspan fill="${c}">${esc(d.kind)}</tspan> ${esc(cut(title(n),36))}<tspan fill="#ff7ad9">${more}</tspan>${n.side>=0&&openHops(d)?`<tspan fill="#ff4fe8"> ⇢${openHops(d)}</tspan>`:''}</text>
      <text class="t2" x="12" y="31">${esc(line2)}</text></g>`;});
  g.innerHTML=h; window._vs=vs;
  svg.querySelector('defs').innerHTML=Object.entries(KIND).map(([k,c])=>`<marker id="${mk(k)}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8z" fill="${c}"/></marker>`).join('');
  apply();}
function count(n){return n.kids.reduce((s,k)=>s+1+count(k),0);}
// focus fits the seed and up to 2 columns each side, so the first steps read at a useful size.
function focusView(){const a=centers[0]; if(!a)return fit();
  fit(visible().filter(n=>Math.abs(n.x-a.x)<=2*COL+1));}
function fit(only){const vs=Array.isArray(only)&&only.length?only:visible(); let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  vs.forEach(n=>{x0=Math.min(x0,n.x-NW/2);x1=Math.max(x1,n.x+NW/2);y0=Math.min(y0,n.y-NH);y1=Math.max(y1,n.y+NH);});
  const w=innerWidth-40,h=innerHeight-panelH()-60; view.k=Math.min(1.2,w/(x1-x0),h/(y1-y0+60));
  view.x=20+w/2-(x0+x1)/2*view.k; view.y=30+h/2-(y0+y1)/2*view.k; apply();}
const panelH=()=>document.getElementById('dock').offsetHeight; // the canvas is the area above the bottom panel
function center(n){view.x=innerWidth/2-n.x*view.k; view.y=(innerHeight-panelH())/2-n.y*view.k; apply();}
function setAll(open){all.forEach(n=>{if(n.side)n.open=open;}); draw(); fit();}

// ---- interaction ----
let drag=null;
svg.onmousedown=e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false}; svg.style.cursor='grabbing';};
addEventListener('mousemove',e=>{if(!drag)return; const dx=e.clientX-drag.x,dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;
  view.x=drag.vx+dx; view.y=drag.vy+dy; apply();});
addEventListener('mouseup',e=>{svg.style.cursor='grab'; const was=drag; drag=null; if(!was||was.moved)return;
  const el=e.target.closest?.('.node'); if(!el)return; const n=window._vs[+el.dataset.i];
  if(n.kids.length&&(!n.open||e.altKey))n.open=!n.open; sel=n; draw(); details();}); // click opens and selects; alt-click closes
// Two-finger scroll pans; pinch (wheel + ctrlKey) and Cmd+scroll zoom.
const zoomAt=(x,y,k)=>{const wx=(x-view.x)/view.k, wy=(y-view.y)/view.k;
  view.k=Math.min(8,Math.max(.05,k)); view.x=x-wx*view.k; view.y=y-wy*view.k; apply();};
let pinch=null; // Safari pinch: gesture events with an absolute scale, not ctrl+wheel
svg.addEventListener('wheel',e=>{e.preventDefault();
  if(!e.ctrlKey&&!e.metaKey){view.x-=e.deltaX; view.y-=e.deltaY; apply(); return;}
  if(pinch)return;
  const dy=e.deltaY*(e.deltaMode===1?16:1); // Firefox reports lines, not pixels
  zoomAt(e.clientX,e.clientY,view.k*Math.exp(-dy*(e.ctrlKey?.06:.01)));},{passive:false});
addEventListener('gesturestart',e=>{e.preventDefault(); pinch={k:view.k,x:e.clientX,y:e.clientY};});
addEventListener('gesturechange',e=>{e.preventDefault(); if(pinch)zoomAt(pinch.x,pinch.y,pinch.k*e.scale**2);}); // squared: a full pinch spans more zoom
addEventListener('gestureend',e=>{e.preventDefault(); pinch=null;});
// Call path between the seed's function and the selected step's, computed by attachCalls.
function calls(){const el=document.getElementById('calls'); if(!sel||!sel.side){el.style.display='none';return;}
  const c=sel.d.call; el.style.display='block';
  if(!c){el.innerHTML='<span class="hint">no call path in the index for this step (same function as the seed, a struct field, or an unindexed project)</span>';return;}
  el.innerHTML=c.Steps.map((st,k)=>{const n=st.Node, prev=k?c.Steps[k-1].Node.Project:null, nm=(n.Project&&n.Project!==prev?n.Project+' · ':'')+n.Name; // project shown where it changes
    const hop=k?`<span class="hop" style="${/grpc|pubsub/.test(st.Via)?'color:#ff4fe8':''}">─${esc(st.Via)}${st.Method?' '+esc(st.Method):''}→</span>`:'';
    return hop+`<span class="fn" title="${esc(n.Project+':'+n.File+':'+n.Line)}">${esc(nm)}</span>`;}).join('')
    +` <span class="hint">· ${c.Steps.length-1} hops${c.Iface?` · ${c.Iface} interface (${c.Sure} sure)`:''}</span>`;}
addEventListener('keydown',e=>{if(e.target.id==='q')return;
  if(e.ctrlKey||e.metaKey||e.altKey)return; // leave copy, paste and other shortcuts to the browser
  if(e.key==='f')fit(); if(e.key==='c')focusView(); if(e.key==='Escape'){sel=null;draw();details();}});

// ---- side panel ----
const side=document.getElementById('side');
// The options the run was traced with; runs saved before they were recorded show none.
const opts=[D.only&&'only='+D.only, D.maxProjects&&'max-projects='+D.maxProjects, D.includeTests&&'include-tests',
  OPEN&&'depth='+OPEN].filter(Boolean).join(' ');
side.innerHTML=`<div class="ctl"><h1>DOTWEAVIER · LIFECYCLE</h1><div class="ep">${esc(D.addr)}</div>${opts?`<div class="hint">${esc(opts)}</div>`:''}
 <div class="hint">${nOrigin} origin steps ◀ seed ▶ ${nUses} lifecycle steps</div>
 <div id="qbox"><span id="chip" hidden> <b title="remove project · backspace">×</b></span><input id="q" autocomplete="off"></div><div class="hint" id="hits"></div>
 <button id="ea">expand all</button><button id="ca">collapse all</button><button id="fi">fit</button><button id="fo">focus</button>${served?`<a href="/trace-field/export?${new URLSearchParams({run:traceName,...keepOpen})}" download><button>export html</button></a>`:''}${served&&all.some(n=>n.side>=0&&openHops(n.d))?`<br><button id="fa">follow all hops</button> <select id="fd"><option>1</option><option selected>2</option><option>3</option></select> services deep <span class="hint" id="faMsg"></span>`:''}

 </div><div id="det"></div>`;
document.getElementById('legend').innerHTML=Object.entries(KIND).map(([k,c])=>`<span class="lg"><i style="background:${c}"></i>${k}</span>`).join('');

// ---- search: typing changes only the results list; steps (dimming, opening, focus) change on Enter ----
// mode 'proj' lists the projects on screen; picking one, or all projects (scope null), switches to 'step'.
let mode='proj', scope=null, dimQ='', res=[], resQ=null, ri=-1, picked=false, off=0, timer=0, acc=0;
const ROWS=10, qi=document.getElementById('q'), box=document.getElementById('res'), shown=()=>box.style.display==='block';
const inScope=n=>scope===null||n.p===scope;
function dimmed(n){return !inScope(n)||!!dimQ&&!n.hay.includes(dimQ);}
// Results: projects with their on-screen step count, or steps of the scope, shallowest first, on-screen before collapsed.
function refresh(){clearTimeout(timer); const q=qi.value.trim().toLowerCase(); resQ=q; ri=-1; picked=false; off=0;
  if(mode==='proj'){const c=new Map(); visible().forEach(n=>c.set(n.p,(c.get(n.p)||0)+1));
    res=[{all:1},...[...c].filter(([p])=>p.toLowerCase().includes(q)).map(([p,k])=>({p,k}))];}
  else{const on=new Set(visible()); res=all.filter(n=>inScope(n)&&(!q||n.hay.includes(q))).sort((a,b)=>a.depth-b.depth||on.has(b)-on.has(a));}
  document.getElementById('hits').textContent=mode==='proj'?`${res.length-1} projects on screen`:`${res.length} matches · enter: next`;
  list();}
function row(x){if(mode==='proj')return x.all?'all projects':`${esc(x.p||'?')} <span class="at">· ${x.k} on screen</span>`;
  const d=x.d; return `${scope===null?`<span class="at">${esc(x.p||'?')} ·</span> `:''}<span style="color:${KIND[d.kind]||'#888'}">${esc(d.kind)}</span> ${esc(cut(title(x),48))} <span class="at">${esc(cut(d.kind==='field'?d.type:d.code,48))}</span>`;}
function list(){if(document.activeElement!==qi||!res.length){box.style.display='none';return;}
  const r=qi.getBoundingClientRect(); Object.assign(box.style,{display:'block',left:r.left+'px',bottom:innerHeight-r.top+4+'px'});
  box.innerHTML=res.slice(off,off+ROWS).map((x,k)=>`<div class="rr${off+k===ri?' cur':''}" data-k="${off+k}">${row(x)}</div>`).join('')
    +(res.length>ROWS?`<div class="ttl">${off+1}–${Math.min(off+ROWS,res.length)} of ${res.length} · scroll for more</div>`:'');}
const track=()=>{off=Math.max(0,Math.min(off,ri,res.length-ROWS),ri-ROWS+1);}; // window follows the highlighted row
function move(k){if(!res.length)return; ri=Math.max(0,Math.min(res.length-1,k)); picked=true; track(); list();}
function enter(){if(resQ!==qi.value.trim().toLowerCase())refresh(); go();}
// Enter: pick a project, or dim steps by the text and focus the highlighted result, else the next match.
function go(){if(mode==='proj'){const x=res[ri>=0?ri:resQ&&res.length>1?1:0]; if(x)pick(x.all?null:x.p); return;}
  dimQ=resQ; if(res.length){if(!picked)ri=(ri+1)%res.length; picked=false; sel=res[ri]; for(let p=sel.parent;p;p=p.parent)p.open=true;}
  draw(); if(res.length){center(sel); details(); track();} list();}
function pick(p){mode='step'; scope=p; setQ();}
function unpick(){mode='proj'; scope=null; setQ();}
function setQ(){dimQ=''; qi.value=''; chip(); draw(); refresh();
  setP();}
// The home project may be named '', so "no project" is scope null, never a falsy check.
function setP(){try{const u=new URLSearchParams(location.search); scope!==null?u.set('p',scope):u.delete('p'); history.replaceState(null,'','?'+u);}catch{}} // file:// may refuse
function chip(){const c=document.getElementById('chip'), nm=scope===null?'all projects':scope||'?'; c.hidden=mode==='proj'; c.firstChild.textContent=nm+' ';
  qi.placeholder=mode==='proj'?'search: project…':`search steps in ${nm} · enter: see matches`;}
qi.oninput=()=>{clearTimeout(timer); timer=setTimeout(refresh,150);};
qi.onfocus=()=>resQ===qi.value.trim().toLowerCase()?list():refresh(); // refocus keeps the place in the matches
qi.onblur=()=>{box.style.display='none';};
qi.onkeydown=e=>{const k=e.key;
  if(k==='Enter'){e.preventDefault(); enter();}
  else if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault(); if(!shown())refresh(); move(ri+(k==='ArrowDown'?1:-1));}
  else if(k==='Escape'){if(shown())box.style.display='none'; else if(qi.value||dimQ){qi.value=''; dimQ=''; draw(); refresh(); box.style.display='none';} else if(mode==='step')unpick();}
  else if(k==='Backspace'&&!qi.value&&mode==='step')unpick();};
box.onmousedown=e=>e.preventDefault(); // keep focus in the input
box.onclick=e=>{const r=e.target.closest('.rr'); if(!r)return; clearTimeout(timer); ri=+r.dataset.k; picked=true; go();}; // acts on the rows shown, not a pending refresh
box.addEventListener('wheel',e=>{e.preventDefault(); acc+=e.deltaY*(e.deltaMode===1?16:1); const s=Math.trunc(acc/20); if(!s)return;
  acc-=s*20; off=Math.max(0,Math.min(res.length-ROWS,off+s)); list();},{passive:false});
document.querySelector('#chip b').onclick=()=>{unpick(); qi.focus();};
const wantP=new URLSearchParams(location.search).get('p'); if(wantP!==null){if(all.some(n=>n.p===wantP)){mode='step'; scope=wantP;} else setP();}
chip();
document.getElementById('ea').onclick=()=>setAll(true);
document.getElementById('ca').onclick=()=>setAll(false);
document.getElementById('fi').onclick=()=>fit();
document.getElementById('fo').onclick=focusView;
document.getElementById('fa')?.addEventListener('click',()=>follow({depth:document.getElementById('fd').value}));
function details(){calls(); const el=document.getElementById('det'); if(!sel){el.innerHTML='<div class="hint">select a node for details</div>';return;}
  const d=sel.d, ln=+(d.loc||'').split(':').pop()||0, c=KIND[d.kind]||'#888', dir=d.kind==='overwritten'?'another value written into the field on its left; not traced here':
    sel.side<0?'flows into the step on its right':sel.side>0?'flows from the step on its left':'the traced value';
  el.innerHTML=`<span class="k" style="background:${c}">${esc(d.kind)}</span> <span class="hint">${dir}</span>`+
    (d.name?`<div class="row">field <b>${esc(d.name)}</b></div>`:'')+(d.loc?`<div class="row">at <b>${esc(d.loc)}</b>${served?' <button id="vf">view file</button>':''}</div>`:'')+
    (d.fn?`<div class="row">in <b>${esc(d.fn)}</b></div>`:'')+(d.type?`<div class="row">type <b>${esc(d.type)}</b></div>`:'')+
    (d.via?`<div class="row">called at <b>${esc(d.via)}</b></div>`:'')+
    ((d.hops||[]).length&&sel.side>=0?`<div class="row">calls other services:</div>`+d.hops.map((h,k)=>`<div class="row"><span class="k" style="background:${KIND[h.kind]||'#888'}">${esc(h.kind)}</span> ${esc(h.method)} → <b>${esc(h.project)}</b> ${esc(h.fn)} ${h.followed?'<span class="hint">followed</span>':served?`<button class="fh" data-k="${k}">follow ⇢</button>`:''}</div>`).join('')+'<div class="hint" id="fhMsg"></div>':'')+(d.code?`<pre>${d.before?`<span class="ctx"><span class="ln">${ln-1}</span>${esc(d.before)}</span>\n`:''}<span class="ln">${ln}</span><b>${esc(d.code)}</b>${d.after?`\n<span class="ctx"><span class="ln">${ln+1}</span>${esc(d.after)}</span>`:''}</pre>`:'')+
    (sel.kids.length?`<div class="row">${count(sel)} steps ${sel.side<0?'further back':'further on'} <button id="tg">${sel.open?'collapse':'expand'}</button></div>`:'')+
    '';
  document.getElementById('tg')?.addEventListener('click',()=>{sel.open=!sel.open; draw(); details();});
  document.getElementById('vf')?.addEventListener('click',()=>viewFile(qualify(d.loc)));
  document.querySelectorAll('#det .fh').forEach(b=>b.onclick=()=>follow({path:sel.path.join('.'),hop:b.dataset.k},sel.path));}
// Following a hop saves a new run on the server; the page opens it with the step still selected.
async function follow(q,keep){const msg=document.getElementById('fhMsg')||document.getElementById('faMsg'); msg.textContent='following…';
  try{const r=await fetch('/trace-field/follow?'+new URLSearchParams({run:traceName,...q}),{method:'POST',headers:{'X-Dotweavier':'1'}}); const j=await r.json();
    if(!r.ok)throw new Error(j.error||r.statusText); location.search='?'+new URLSearchParams({t:j.run,...keepOpen,...(keep?{sel:keep.join('.')}:{}),...(scope!==null?{p:scope}:{})});}
  catch(e){msg.textContent=String(e.message||e);}}
// Whole-file viewer (served pages only): line numbers, the step's line highlighted and scrolled to.
async function viewFile(loc){const v=document.getElementById('viewer'), body=document.getElementById('vBody'), t=document.getElementById('vTitle');
  t.textContent=loc; body.textContent='loading…'; v.classList.add('open');
  try{const r=await fetch('/source?loc='+encodeURIComponent(loc),{headers:{'X-Dotweavier':'1'}}); const f=await r.json();
    if(!r.ok)throw new Error(f.error||r.statusText);
    t.textContent=f.project+':'+f.file+(f.line?':'+f.line:'');
    body.innerHTML=f.text.split('\n').map((l,i)=>`<div${i+1===f.line?' class="hl"':''}><span class="tr" data-l="${i+1}" title="trace from here">⤷</span><span class="ln">${i+1}</span>${esc(l)}</div>`).join('');
    body.onclick=e=>{const b=e.target.closest('.tr'); if(b)traceFrom(f.project+':'+f.file+':'+b.dataset.l);};
    body.querySelector('.hl')?.scrollIntoView({block:'center'});}
  catch(e){body.textContent=String(e.message||e);}}
document.getElementById('vClose').onclick=()=>document.getElementById('viewer').classList.remove('open');
addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('viewer').classList.remove('open');});
// Home-project locations carry no project prefix ("rel.go:LINE"); the server needs the full address.
function qualify(loc){return home&&loc.split(':').length===2?home+':'+loc:loc;}
// A trace from the viewer runs with the open run's options.
async function traceFrom(addr){const msg=document.getElementById('vMsg'); msg.textContent='tracing '+addr+'…';
  const q={addr,...(D.includeTests?{'include-tests':'1'}:{}),...(D.maxProjects?{'max-projects':D.maxProjects}:{}),...(D.only?{only:D.only}:{})};
  try{const r=await fetch('/trace-field?'+new URLSearchParams(q),{method:'POST',headers:{'X-Dotweavier':'1'}}); const j=await r.json();
    if(!r.ok)throw new Error(j.error||r.statusText); location.search='?'+new URLSearchParams({t:j.run,...keepOpen,...(scope!==null?{p:scope}:{})});}
  catch(e){msg.textContent=String(e.message||e);}}
const want=new URLSearchParams(location.search).get('sel'); if(want){sel=all.find(n=>n.side>=0&&n.path.join('.')===want)||null; for(let p=sel?.parent;p;p=p.parent)p.open=true; if(sel)sel.open=true;}
details(); draw(); focusView(); addEventListener('resize',focusView);
}
</script>
</body></html>
