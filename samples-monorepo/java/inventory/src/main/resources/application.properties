# gRPC on its own port; the HTTP port only serves Quarkus internals.
quarkus.grpc.server.use-separate-server=true
quarkus.grpc.server.port=${PORT:9091}
quarkus.grpc.server.test-port=0
quarkus.http.port=8092
quarkus.http.test-port=0

# HTTP hop to the Go orders project.
quarkus.rest-client.orders.url=${ORDERS_URL:http://localhost:8080}
quarkus.rest-client.orders.connect-timeout=2000
quarkus.rest-client.orders.read-timeout=3000

# Seed stock per SKU.
inventory.stock.a=100
inventory.stock.b=5
inventory.stock.c=0
