server.port=${PORT:8082}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
# Wire field names are snake_case, for both the controller and the orders client.
spring.jackson.property-naming-strategy=SNAKE_CASE

# HTTP hop to the Go orders project.
payments.orders.url=${ORDERS_URL:http://localhost:8080}
payments.orders.connect-timeout=2s
payments.orders.read-timeout=3s
